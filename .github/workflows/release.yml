name: Release version to npm

on:
    workflow_dispatch:
    push:
        tags:
            - '*'

permissions:
    id-token: write  # Required for OIDC in npm
    contents: read

jobs:
    ci:
        uses: "./.github/workflows/ci.yml"
    deploy:
        name: deploy
        needs: [ci]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    fetch-tags: true

            -   uses: actions/setup-node@v6
                with:
                    node-version: '24'

            -   uses: pnpm/action-setup@v6
                with:
                    version: 'latest'
                    run_install: >-
                        recursive: false

            -   name: Set version number in package.json
                run: pnpm version $(git describe --tags --abbrev=0) --no-git-tag-version

            -   name: Run Build
                run: pnpm run prepare-release

            -   name: Publish package
                run: pnpm publish --access public --publish-branch "2.x" --no-git-checks
